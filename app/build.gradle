plugins { id 'com.android.application' }
android {
    namespace 'com.joe.waterlite'
    compileSdk 35
    defaultConfig { applicationId 'com.joe.waterlite'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.1.0'; testInstrumentationRunner 'com.joe.waterlite.RegressionInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }



