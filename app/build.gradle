plugins { id 'com.android.application' }
def protocol = new Properties()
def protocolFile = rootProject.file('secrets.properties')
if (protocolFile.exists()) protocolFile.withInputStream { protocol.load(it) }
android {
    buildFeatures { buildConfig true }

    namespace 'com.joe.waterlite'
    compileSdk 35
    defaultConfig { buildConfigField 'String', 'APP_LOGIN_SALT', '"' + protocol.getProperty('APP_LOGIN_SALT', '').replace('\\','\\\\').replace('"','\\"') + '"'; applicationId 'com.joe.waterlite'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.3.0'; testInstrumentationRunner 'com.joe.waterlite.RegressionInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }



